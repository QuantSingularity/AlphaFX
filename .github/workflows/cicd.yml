# ==========================================================================
# AlphaFX CI
#
# Jobs
#   1. code_quality           - Python (autoflake, black) and Prettier formatting gate
#   2. backend_test_build     - Django backend: Pytest with coverage, then Docker
#                               image build and container smoke test
#   3. ai_services_test_build - AI services: Pytest with coverage, then Docker
#                               image build and container smoke test
#   4. frontend_test_build    - Frontend: Vitest with coverage, then production build
#
# Every job waits for code_quality, so formatting problems fail the run before
# any heavy dependencies are installed.
# ==========================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new Black release cannot change formatting under our feet.
      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      # Check-only: nothing is rewritten. Covers the backend and AI services.
      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Solidity plugin lets the same glob below also cover .sol files.
      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      # One Prettier pass over the whole repository (JS/TS, JSON, HTML, CSS,
      # Markdown, Solidity and YAML, including this workflow).
      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # ============================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: alphafx-backend
      CONTAINER_NAME: alphafx-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      # The test tooling is installed separately from the application requirements.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      # --strict-markers fails the run if a test uses an unregistered marker.
      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      # Buildx enables the GitHub Actions layer cache used by the build step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false + load: true builds the image locally for the smoke test
      # without publishing it.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Starts the real container (daphne + alphafx.asgi) and hits /health.
        # No Redis is attached, so the overall status is "degraded" by design;
        # the check asserts the database is reachable instead.
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            -e DJANGO_SETTINGS_MODULE=alphafx.settings.base \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"database":"ok"' <(tr -d ' \n' < response.txt) || {
            echo "Health endpoint did not report a working database." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      # Only runs when an earlier step failed, to make the failure diagnosable.
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      # Always clean up, even when the smoke test fails.
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 3 -- AI Services Test & Build (Pytest + Docker image + smoke test)
  # ============================================================
  ai_services_test_build:
    name: AI Services Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_SERVICES_DIR: code/ai_services
      IMAGE_NAME: alphafx-ai-services
      CONTAINER_NAME: alphafx-ai-services-ci
      # ai_services is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Make sure nothing tries to use a GPU on the runner.
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/ai_services/requirements.txt

      # requirements.txt is the same pinned set the AI services Docker image uses
      # (PyTorch, statsmodels, arch, transformers, FastAPI, ...).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_SERVICES_DIR}/requirements.txt"
          python -m pip install pytest-cov

      # The repository root has a Django-oriented conftest.py and pytest.ini for
      # the backend tests; --confcutdir keeps this suite from loading them.
      - name: Run ai_services test suite
        working-directory: ${{ env.AI_SERVICES_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --confcutdir=. \
            --cov=ai_services \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload ai_services coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-services-coverage-report
          path: code/ai_services/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      # Buildx enables the GitHub Actions layer cache used by the build step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false + load: true builds the image locally for the smoke test
      # without publishing it.
      - name: Build AI services image
        uses: docker/build-push-action@v6
        with:
          context: code/ai_services
          file: code/ai_services/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Starts the real container (uvicorn + ai_services.api.main:app) and hits
        # /ai/health. Model weights are loaded lazily, so no trained models are needed.
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8001:8001 \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for AI service to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ai/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "AI service did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"status":"ok"' <(tr -d ' \n' < response.txt) || {
            echo "AI service health endpoint did not report ok." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      # Only runs when an earlier step failed, to make the failure diagnosable.
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      # Always clean up, even when the smoke test fails.
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 4 -- Frontend Test & Build (Vitest + coverage + production build)
  # ============================================================
  frontend_test_build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins;
      # --legacy-peer-deps tolerates peer dependency conflicts in the tree.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Vitest suite (jsdom): routing, auth context, login page, API client and
      # shared components. Runs before the build so test failures show up first.
      - name: Run frontend test suite
        run: npm run test:coverage

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 30

      # The build runs the TypeScript compiler over src/ first, so type errors in
      # the test files fail it too. CI=false stops it treating lint warnings as errors.
      - name: Build frontend
        run: CI=false npm run build

      # Keeps the production bundle for a week so it can be inspected.
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
