name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Backend Tests (Python / Pytest)
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

  # ============================================================
  # Job 3 -- Backend Build (Docker image + container smoke test)
  # ============================================================
  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend_tests

    env:
      IMAGE_NAME: alphafx-backend
      CONTAINER_NAME: alphafx-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Starts the real container (daphne + alphafx.asgi) and hits /health.
        # No Redis is attached, so the overall status is "degraded" by design;
        # the check asserts the database is reachable instead.
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            -e DJANGO_SETTINGS_MODULE=alphafx.settings.base \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"database":"ok"' <(tr -d ' \n' < response.txt) || {
            echo "Health endpoint did not report a working database." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 4 -- AI Services Build (Docker image + container smoke test)
  # ============================================================
  ai_services_build:
    name: AI Services Build
    runs-on: ubuntu-latest
    needs: backend_tests

    env:
      IMAGE_NAME: alphafx-ai-services
      CONTAINER_NAME: alphafx-ai-services-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/ai_services
          file: code/ai_services/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Starts the real container (uvicorn + ai_services.api.main:app) and hits
        # /ai/health. Model weights are loaded lazily, so no trained models are needed.
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8001:8001 \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for AI service to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ai/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "AI service did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"status":"ok"' <(tr -d ' \n' < response.txt) || {
            echo "AI service health endpoint did not report ok." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 5 -- Frontend Build
  # ============================================================
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
